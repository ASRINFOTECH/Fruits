name: Test Gemini API Key

on:
  workflow_dispatch:

jobs:
  test-gemini:
    runs-on: ubuntu-latest
    steps:
      - name: Test Gemini API Connection
        run: |
          response=$(curl -s -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${{ secrets.GEMINI_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"contents": [{"parts": [{"text": "Hello Gemini, reply with '\''GitHub integration working!'\''"}]}]}')
          
          echo "Gemini Response:"
          echo "$response"
